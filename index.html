<title>redirect to...</title>
<h1 id="red"></h1>
<button id="yes">yes</button>
<button id="no">no</button>
<script>
document.title="redirect to "+new URL(location.href).searchParams.get("redirectto")
document.getElementById("red").innerText="redirect to "+new URL(location.href).searchParams.get("redirectto")
document.getElementById("yes").addEventListener("click", () => {
location.href=new URL(location.href).searchParams.get("redirectto")
})
</script>
